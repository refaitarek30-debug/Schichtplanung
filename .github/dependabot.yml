# Automatische Sicherheits- und Versions-Updates. Jede Änderung kommt als Pull Request
# und läuft durch alle Tests (auch den Sicherheitstest), bevor sie übernommen wird.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      kleine-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
