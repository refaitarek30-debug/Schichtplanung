# Automatische Prüfung bei jeder Änderung: Typen, Lint, Bauen und Oberflächen-Tests
# (die App im Browser gegen eine nachgeahmte Datenbank, siehe tests/e2e/run.mjs).
# Braucht keine Geheimnisse und berührt die echte Datenbank nicht.
name: Tests

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    # Feste Version: Playwright kennt neuere Ubuntu-Fassungen oft noch nicht.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:5459
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon
      NEXT_PUBLIC_SITE_URL: http://localhost:3125
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pakete installieren
        run: npm ci
      - name: Typen prüfen
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Bauen
        run: npm run build
      - name: Browser installieren
        # Erst der Browser selbst (von Playwright, nicht von Ubuntu). Die Systempakete kommen aus den
        # Ubuntu-Spiegeln – sind die gestört, hängt das sonst 20 Minuten. Deshalb mit Zeitlimit; das
        # Runner-Abbild bringt die nötigen Bibliotheken ohnehin mit.
        run: |
          npx playwright install chromium
          timeout 180 npx playwright install-deps chromium || echo "Systempakete übersprungen (Spiegel nicht erreichbar)"
      - name: Oberflächen-Tests
        run: npm run test:e2e

  sicherheit:
    # Greift die echte Datenbankstruktur an (tests/sicherheit): nicht angemeldet, fremde
    # Firma, Privatkonto, Kollege – alle Tabellen, alle Funktionen. Ohne echte Daten.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pruef
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: pruef
    steps:
      - uses: actions/checkout@v4
      - name: Sicherheitstest
        run: tests/sicherheit/pruefen.sh
