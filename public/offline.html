<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keine Verbindung · Schichtplan</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f6f8;
        color: #111827;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .box {
        max-width: 420px;
        background: #fff;
        border: 1px solid #e5e8ee;
        border-radius: 16px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 8px 24px -12px rgba(17, 24, 39, 0.1);
      }
      h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.01em; }
      p { margin: 0 0 20px; color: #5b6472; }
      button {
        border: 0;
        border-radius: 12px;
        background: #2f5bea;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Keine Verbindung</h1>
      <p>
        Der Schichtplan braucht eine Internetverbindung, weil Plan, Urlaub und
        Besetzung immer den aktuellen Stand zeigen sollen.
      </p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
